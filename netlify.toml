# Netlify reads this automatically when the site is connected to this repo — no build
# settings need to be typed into the Netlify UI. Single-package Vite app (same shape as
# Sole Match): build from the repo root and publish Vite's dist/ output.
[build]
  command = "npm install && npm run build"
  publish = "dist"

# Round 15: build with the same Node as Dan's PC (Vite 8 and TypeScript 7 need a recent one).
[build.environment]
  NODE_VERSION = "24"

# Round 16: Google sign-in for cloud saves. Firebase's sign-in handler is served from the game's
# own address (passed through, status 200, not redirected), so it isn't cross-site: Safari blocks
# the cross-site storage the default firebaseapp.com handler needs, which breaks sign-in on the
# iPad, especially from the Home Screen icon. Firebase's "redirect best practices", option 3.
# These must come before the catch-all below (Netlify uses the first rule that matches).
[[redirects]]
  from = "/__/auth/*"
  to = "https://epoch-ca127.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://epoch-ca127.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# Single-page app: any deep link (e.g. a refresh mid-game) should still serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Round 15: offline play. The service worker, the page, and the manifest must always be checked
# for a new version (so an update is noticed); everything under /assets/ has a content hash in
# its name, so it can be cached for good.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
