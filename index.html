<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1, user-scalable=no: the map has its own pinch zoom, and leaving native
         zoom on lets a two-finger gesture zoom the whole page instead (same fix as Dan's
         other games). viewport-fit=cover + safe-area insets keep the HUD clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b1016" />
    <title>Epoch</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="map" aria-label="Game map"></canvas>

      <header id="topbar">
        <div class="line">
          <span id="title">Epoch</span>
          <span id="civLabel"></span>
          <span id="turnLabel"></span>
          <span id="eraLabel"></span>
          <button id="diploBtn" type="button" aria-label="Diplomacy: the civs you have met">🤝 Diplomacy</button>
          <button id="victoryBtn" type="button" aria-label="Victory progress: who is close to winning">🏆</button>
        </div>
        <div class="line">
          <span id="goldLabel"></span>
          <button id="researchBtn" type="button" aria-label="Research: open the tech screen"></button>
          <span id="rateCtl">
            <button id="rateDown" type="button" aria-label="Less science, more gold">−</button>
            <span id="rateLabel"></span>
            <button id="rateUp" type="button" aria-label="More science, less gold">+</button>
          </span>
        </div>
      </header>

      <button id="menuBtn" type="button" aria-label="Game menu">☰</button>

      <div id="toasts" aria-live="polite"></div>

      <section id="unitPanel" hidden>
        <div id="unitInfo"></div>
        <div id="stackList" hidden></div>
        <div class="row">
          <button id="foundBtn" type="button">Found City</button>
          <button id="fortifyBtn" type="button">Fortify</button>
          <button id="nextBtn" type="button">Next Unit</button>
          <button id="deselectBtn" type="button" aria-label="Deselect unit">✕</button>
        </div>
      </section>

      <section id="cityPanel" class="scroll" hidden aria-label="City"></section>

      <button id="endTurnBtn" type="button">End Turn</button>

      <!-- Dev scenarios only (never shown in the production build). -->
      <div id="devBanner" hidden>
        <div id="devBannerText"></div>
        <div class="row">
          <button id="devBackBtn" type="button">Back to my game</button>
          <button id="devBannerClose" type="button" aria-label="Hide this note">✕</button>
        </div>
      </div>

      <div id="techOverlay" class="overlay" hidden>
        <section id="techPanel" role="dialog" aria-modal="true" aria-label="Technology">
          <div class="techHead">
            <div>
              <h2>Technology</h2>
              <div id="techStatus" class="sub"></div>
            </div>
            <button id="techCloseBtn" type="button" class="closeBtn" aria-label="Close tech screen">✕</button>
          </div>
          <div id="techBody">
            <div id="techTree" class="scroll"></div>
            <div id="techDetail" class="scroll"></div>
          </div>
        </section>
      </div>

      <div id="diploOverlay" class="overlay" hidden>
        <section id="diploPanel" role="dialog" aria-modal="true" aria-label="Diplomacy">
          <div class="techHead">
            <div>
              <h2>Diplomacy</h2>
              <div id="diploStatus" class="sub"></div>
            </div>
            <button id="diploCloseBtn" type="button" class="closeBtn" aria-label="Close diplomacy">✕</button>
          </div>
          <div id="diploBody">
            <div id="diploList" class="scroll"></div>
            <div id="diploDetail" class="scroll"></div>
          </div>
        </section>
      </div>

      <div id="attackOverlay" class="overlay" hidden>
        <section id="attackPanel" class="dialog" role="dialog" aria-modal="true" aria-label="Attack">
          <div id="attackBody"></div>
          <div class="row">
            <button id="attackCancelBtn" type="button" class="bigBtn">Cancel</button>
            <button id="attackGoBtn" type="button" class="bigBtn danger">Attack</button>
          </div>
        </section>
      </div>

      <div id="victoryOverlay" class="overlay" hidden>
        <section id="victoryPanel" role="dialog" aria-modal="true" aria-label="Victory progress">
          <div class="techHead">
            <div>
              <h2>Victory progress</h2>
              <div id="victoryStatus" class="sub"></div>
            </div>
            <button id="victoryCloseBtn" type="button" class="closeBtn" aria-label="Close victory progress">✕</button>
          </div>
          <div id="victoryBody" class="scroll"></div>
        </section>
      </div>

      <div id="endOverlay" class="overlay" hidden>
        <section id="endPanel" class="dialog" role="dialog" aria-modal="true">
          <div id="endBanner"></div>
          <h2 id="endTitle"></h2>
          <p id="endText"></p>
          <div id="endStats" class="scroll"></div>
          <div class="row">
            <button id="endCloseBtn" type="button" class="bigBtn">Keep playing</button>
            <button id="endNewBtn" type="button" class="bigBtn">New Game</button>
          </div>
        </section>
      </div>

      <!-- News that needs an answer or a moment: first contact, war declared on you, AI offers. -->
      <div id="noticeOverlay" class="overlay" hidden>
        <section id="noticePanel" class="dialog" role="dialog" aria-modal="true">
          <h2 id="noticeTitle"></h2>
          <p id="noticeText"></p>
          <div id="noticeButtons" class="row"></div>
        </section>
      </div>

      <div id="menuOverlay" class="overlay" hidden>
        <div class="dialog" role="dialog" aria-modal="true">
          <div id="menuMain">
            <h2>Game</h2>
            <p id="menuInfo"></p>
            <div class="row">
              <button id="victoryMenuBtn" type="button">Victory progress</button>
              <button id="aboutBtn" type="button">About / Credits</button>
              <button id="restoreBtn" type="button">Restore a backup</button>
              <button id="newGameBtn" type="button">New Game</button>
              <button id="menuCloseBtn" type="button">Close</button>
            </div>
            <div id="devMenu" hidden></div>
          </div>
          <div id="menuBackups" hidden>
            <h2>Restore a backup</h2>
            <div id="backupList" class="scroll"></div>
            <div class="row">
              <button id="backupsBackBtn" type="button">Back</button>
            </div>
          </div>
          <div id="menuAbout" hidden>
            <h2>About Epoch</h2>
            <div id="aboutBody" class="scroll"></div>
            <div class="row">
              <button id="aboutBackBtn" type="button">Back</button>
            </div>
          </div>
          <div id="menuConfirm" hidden>
            <h2>Start a new game?</h2>
            <p>Your current game will be kept as a backup (☰ → Restore a backup).</p>
            <div class="row">
              <button id="confirmNoBtn" type="button">Cancel</button>
              <button id="confirmYesBtn" type="button" class="danger">Start New Game</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
