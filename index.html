<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1, user-scalable=no: the map has its own pinch zoom, and leaving native
         zoom on lets a two-finger gesture zoom the whole page instead (same fix as Dan's
         other games). viewport-fit=cover + safe-area insets keep the HUD clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b1016" />
    <title>Epoch</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="map" aria-label="Game map"></canvas>

      <header id="topbar">
        <span id="title">Epoch</span>
        <span id="civLabel"></span>
        <span id="turnLabel"></span>
      </header>

      <div id="toasts" aria-live="polite"></div>

      <section id="unitPanel" hidden>
        <div id="unitInfo"></div>
        <div class="row">
          <button id="foundBtn" type="button">Found City</button>
          <button id="nextBtn" type="button">Next Unit</button>
        </div>
      </section>

      <button id="endTurnBtn" type="button">End Turn</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
